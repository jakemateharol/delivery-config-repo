server:
  port: 8083

spring:
  application:
    name: inventory-service

  datasource:
    # 🔧 CORREGIDO: de localhost:3304 a mysql-db:3306 (hostname real del
    # contenedor de base de datos dentro de la red de docker-compose).
    url: jdbc:mysql://mysql-db:3306/delivery_inventory_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

eureka:
  client:
    service-url:
      # 🔧 CORREGIDO: de localhost a registry-server
      defaultZone: http://registry-server:8761/eureka/

# 📊 CONFIGURACIÓN DE OBSERVABILIDAD (ACTUATOR & PROMETHEUS)
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
