server:
  port: 8081

spring:
  application:
    name: users-service

  datasource:
    # 🔧 CORREGIDO: de localhost:3304 (no válido dentro de un contenedor) a
    # mysql-db:3306, que es el hostname/puerto real del servicio mysql-db en
    # docker-compose.
    url: jdbc:mysql://mysql-db:3306/delivery_users_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

eureka:
  client:
    service-url:
      # 🔧 CORREGIDO: de localhost a registry-server (hostname del contenedor)
      defaultZone: http://registry-server:8761/eureka/

# 📊 CONFIGURACIÓN DE OBSERVABILIDAD (ACTUATOR & PROMETHEUS)
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
